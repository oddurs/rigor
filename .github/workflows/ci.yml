name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        # rigor runs on macOS and Linux, and their userlands differ in ways
        # that have already broken a script here once (BSD tr).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-nextest,shellcheck,typos

      # install-action has no actionlint. go install pins the version and
      # verifies the module against Go's checksum database.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          gopath=$(go env GOPATH)
          echo "$gopath/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      # The only command CI runs to check. Local hooks run the same one, so the
      # two cannot drift.
      - run: scripts/task check

      - name: Test report
        if: always()
        shell: python3 {0}
        run: |
          import os, xml.etree.ElementTree as ET
          path = "target/nextest/ci/junit.xml"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          if not os.path.exists(path):
              out.write("No test results: the run stopped before tests.\n")
              raise SystemExit
          cases = [
              (tc.get("classname"), tc.get("name"), float(tc.get("time", 0)),
               tc.find("failure") is not None or tc.find("error") is not None)
              for tc in ET.parse(path).getroot().iter("testcase")
          ]
          failed = [c for c in cases if c[3]]
          out.write(f"### Tests on {os.environ.get('RUNNER_OS')}: "
                    f"{len(cases) - len(failed)} passed, {len(failed)} failed\n\n")
          for c in failed:
              out.write(f"- ❌ `{c[0]}::{c[1]}`\n")
          out.write("\n| slowest | seconds |\n|---|---:|\n")
          for c in sorted(cases, key=lambda c: -c[2])[:5]:
              out.write(f"| `{c[1]}` | {c[2]:.1f} |\n")

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - run: scripts/task coverage | tee coverage.txt

      - name: Coverage summary
        run: |
          {
            echo "### Coverage"
            echo '```'
            sed -n '/^Filename/,/^TOTAL/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-deny

      - run: scripts/task audit

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [check, coverage, audit]
    # Branch protection requires this one job. A job skipped because something
    # it needs failed reports as skipped, and a skipped required check counts
    # as passing, so this always runs and passes only if every job succeeded.
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job did not succeed: $RESULTS"
              exit 1
            fi
          done
          echo "all required jobs passed"
