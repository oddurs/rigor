name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-nextest,shellcheck,typos

      # install-action has no actionlint. go install pins the version and
      # verifies the module against Go's checksum database; Go is on every
      # runner image.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          gopath=$(go env GOPATH)
          echo "$gopath/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      - run: scripts/task check

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" --verify-tag --generate-notes

          # Generated notes are built from pull request titles, which the
          # commit-msg hook already keeps clean. Strip attribution anyway: a
          # published release must never carry it.
          # The pattern is shared with the commit-msg hook. grep exits 1 when it
          # removed every line; only a failure to read the pattern is an error.
          notes=$(gh release view "$TAG" --json body -q .body)
          clean=$(printf '%s\n' "$notes" | grep -Eiv -f .githooks/attribution.ere || [ $? -eq 1 ])
          if [ "$notes" != "$clean" ]; then
            printf '%s\n' "$clean" | gh release edit "$TAG" --notes-file -
          fi
