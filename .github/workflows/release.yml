name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-nextest,shellcheck

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      - run: scripts/task check

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" --verify-tag --generate-notes

          # Generated notes are built from pull request titles, which the
          # commit-msg hook already keeps clean. Strip attribution anyway: a
          # published release must never carry it.
          notes=$(gh release view "$TAG" --json body -q .body)
          clean=$(printf '%s\n' "$notes" | grep -Eiv 'co-authored-by:.*(claude|anthropic|openai|gpt|copilot|cursor|codex|gemini|devin)|generated with|generated by .*(claude|ai)|claude-session|noreply@anthropic\.com|🤖' || true)
          if [ "$notes" != "$clean" ]; then
            printf '%s\n' "$clean" | gh release edit "$TAG" --notes-file -
          fi
