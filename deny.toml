# Supply-chain policy, checked by `scripts/task audit` and in CI.

[graph]
all-features = true

[advisories]
# Any RustSec advisory against a dependency — vulnerability, unmaintained crate,
# or yanked release — fails the check until it is addressed.
yanked = "deny"

[licenses]
# Exactly the licenses the dependency tree needs today. A crate under any other
# license fails the check, so it is looked at before it ships inside rigor.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
# Two versions of one crate compile the same code twice. Reported, not denied:
# most come from upstream dependencies and are not rigor's to fix.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
