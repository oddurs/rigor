# Spelling, checked by `scripts/task lint`. American English throughout, to
# match the identifiers (ratatui's `Color`, our `parse_color`) and the Rust
# ecosystem, so prose and code do not disagree.
[default]
locale = "en-us"

[files]
# Dotfiles too: .github, .githooks and .config are prose and scripts like any
# other, and typos skips hidden paths unless told otherwise.
ignore-hidden = false
extend-exclude = [
  ".git/",
  "Cargo.lock",
  "site/pnpm-lock.yaml",
  # Generated from source: regenerated, never edited by hand.
  "*.snap",
  "proptest-regressions/",
]
