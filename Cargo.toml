[package]
name = "rigor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Terminal dashboard for the pull requests you have out on a repo"
repository = "https://github.com/oddurs/rigor"
license = "MIT"
readme = "README.md"
keywords = ["tui", "github", "pull-request", "ci", "worktree"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/.githooks", "/scripts"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
